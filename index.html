<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1F37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="飛行日誌">
  <meta name="description" content="端末内で飛行記録を管理するアプリ">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>フライトログ</title>
  <style>
    :root {
      --bg: #0F1F37;
      --panel: #172B49;
      --line: #35527D;
      --text: #EAF1FB;
      --sub: #AFC0D8;
      --accent: #6FD0F0;
      --danger: #FF8A7A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    .app-shell {
      width: 100%;
      max-width: 520px;
      min-height: min(760px, calc(100vh - 32px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.22);
    }
    header {
      padding: 18px 22px 15px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      margin: 0;
      color: var(--accent);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    .brand-sub {
      margin: 2px 0 0;
      color: var(--sub);
      font-size: 11px;
      letter-spacing: .16em;
    }
    main {
      width: 100%;
      flex: 1;
      padding: 24px 22px 28px;
    }
    .status {
      margin: 0 0 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(8, 20, 38, .38);
      color: var(--sub);
      font-size: 13px;
    }
    .status.error, .error { color: var(--danger); }
    .screen { display: none; }
    .screen.active { display: block; }
    h2 {
      margin: 4px 0 18px;
      color: var(--text);
      font-size: 23px;
      letter-spacing: .04em;
    }
    .home-title {
      margin: 12px 0 2px;
      text-align: center;
      font-size: 29px;
      letter-spacing: .08em;
    }
    .home-lead {
      margin: 0 0 30px;
      color: var(--sub);
      text-align: center;
      font-size: 14px;
    }
    button {
      width: 100%;
      min-height: 58px;
      margin: 0 0 13px;
      padding: 12px 16px;
      border: 2px solid var(--line);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 17px;
      font-weight: 650;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    button:hover { border-color: var(--accent); }
    button:active { background: rgba(111, 208, 240, .12); }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .menu-button .icon {
      width: 1.3em;
      color: var(--accent);
      font-size: 20px;
      text-align: center;
    }
    .action-button {
      border-color: var(--accent);
      background: var(--accent);
      color: #0F1F37;
      font-weight: 750;
    }
    .back-button {
      background: transparent;
      color: var(--sub);
    }
    .delete-button {
      width: auto;
      min-height: 42px;
      margin: 12px 0 0;
      padding: 7px 14px;
      border-color: #7A4A47;
      color: var(--danger);
      font-size: 14px;
    }
    label {
      display: block;
      margin: 0 0 7px;
      color: var(--sub);
      font-size: 14px;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 210px;
      padding: 13px;
      border: 2px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      resize: vertical;
    }
    textarea::placeholder { color: #8398B6; }
    .help, .empty {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(8, 20, 38, .28);
      color: var(--sub);
      font-size: 13px;
    }
    .home-help { margin-top: 20px; }
    .memo-card {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(8, 20, 38, .28);
      overflow-wrap: anywhere;
    }
    .memo-date { margin-bottom: 7px; color: var(--sub); font-size: 12px; }
    .memo-text { white-space: pre-wrap; }
    .button-row { margin-top: 16px; }
    .file-label {
      display: block;
      margin: 12px 0;
      padding: 13px;
      border: 2px dashed var(--line);
      border-radius: 7px;
      color: var(--text);
      text-align: center;
      font-weight: 650;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 10px;
      color: var(--sub);
      font-size: 14px;
    }
    .small-note { color: var(--sub); font-size: 13px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    footer {
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      color: var(--sub);
      text-align: center;
      font-size: 10px;
      letter-spacing: .16em;
    }
    @media (max-width: 380px) {
      main { padding-right: 16px; padding-left: 16px; }
      header { padding-right: 17px; padding-left: 17px; }
      .home-title { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <p class="brand">FLIGHT LOG</p>
      <p class="brand-sub">DRONE FLIGHT MANAGEMENT</p>
    </header>

    <main>
      <div id="globalStatus" class="status" role="status" aria-live="polite">準備しています。</div>

      <section id="homeScreen" class="screen active">
        <h2 class="home-title">フライトログ</h2>
        <p class="home-lead">飛行記録を管理する</p>
        <button class="menu-button" id="goWrite"><span class="icon" aria-hidden="true">＋</span>メモを書く</button>
        <button class="menu-button" id="goList"><span class="icon" aria-hidden="true">▤</span>メモの一覧</button>
        <button class="menu-button" id="goBackup"><span class="icon" aria-hidden="true">⇧</span>バックアップ</button>
        <p class="help home-help">この試作品のメモは、この端末のブラウザ内に保存されます。</p>
      </section>

      <section id="writeScreen" class="screen">
        <h2>メモを書く</h2>
        <label for="memoInput">メモの内容</label>
        <textarea id="memoInput" placeholder="ここにメモを入力してください。"></textarea>
        <div class="button-row">
          <button class="action-button" id="saveMemo">保存</button>
          <button class="back-button" data-back>ホームに戻る</button>
        </div>
      </section>

      <section id="listScreen" class="screen">
        <h2>メモの一覧</h2>
        <div id="memoList"></div>
        <button class="back-button" data-back>ホームに戻る</button>
      </section>

      <section id="backupScreen" class="screen">
        <h2>バックアップ</h2>
        <p class="help">書き出し：保存済みのメモをJSONファイルにします。</p>
        <button class="action-button" id="exportBackup">書き出し</button>
        <div class="help">
          <strong>読み込み：</strong><br>
          JSONバックアップを選んで読み込みます。同じIDのメモは重複追加せず、新しいメモだけを追加します。現在のメモは削除・上書きしません。
        </div>
        <label class="file-label" for="backupFile">読み込むJSONファイルを選択
          <input id="backupFile" type="file" accept=".json,application/json">
        </label>
        <button class="action-button" id="importBackup">読み込み</button>
        <button class="back-button" data-back>ホームに戻る</button>
      </section>
    </main>

    <footer>DEVICE STORAGE / OFFLINE READY</footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
