<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#172B49">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="飛行日誌">
  <meta name="description" content="端末内でメモを管理するオフライン動作確認用アプリ">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>飛行日誌アプリ STEP1</title>
  <style>
    :root {
      --navy: #172B49;
      --blue: #31577F;
      --pale: #EEF3F8;
      --gold: #B08D57;
      --text: #17202B;
      --muted: #526171;
      --border: #CBD5E1;
      --danger: #A32626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #F3F5F7;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }
    header {
      background: var(--navy);
      color: white;
      padding: 20px 18px 16px;
      padding-top: max(20px, env(safe-area-inset-top));
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 4px 0 0; font-size: 14px; color: #E1E8F0; }
    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
    }
    h2 { margin: 0 0 16px; font-size: 23px; color: var(--navy); }
    .screen { display: none; }
    .screen.active { display: block; }
    .menu-button, .action-button, .back-button, .delete-button {
      display: block;
      width: 100%;
      min-height: 64px;
      border: 2px solid var(--navy);
      border-radius: 12px;
      padding: 14px 18px;
      margin: 0 0 14px;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .menu-button, .action-button {
      background: var(--navy);
      color: white;
    }
    .menu-button:focus-visible, button:focus-visible, textarea:focus-visible {
      outline: 4px solid #E1B85B;
      outline-offset: 3px;
    }
    .back-button {
      background: white;
      color: var(--navy);
      margin-top: 22px;
    }
    .delete-button {
      min-height: 48px;
      width: auto;
      padding: 8px 18px;
      margin: 10px 0 0;
      background: white;
      color: var(--danger);
      border-color: var(--danger);
      font-size: 17px;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      resize: vertical;
    }
    .help, .status, .empty {
      padding: 14px;
      border-radius: 10px;
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 16px;
    }
    .status { margin-bottom: 16px; }
    .memo-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }
    .memo-date { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .memo-text { white-space: pre-wrap; }
    .button-row { margin-top: 16px; }
    .file-label {
      display: block;
      margin: 12px 0;
      padding: 14px;
      background: white;
      border: 2px dashed var(--blue);
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
    }
    input[type="file"] { display: block; width: 100%; margin-top: 10px; font-size: 16px; }
    .small-note { font-size: 14px; color: var(--muted); }
    .error { color: var(--danger); font-weight: 700; }
    button:disabled { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>飛行日誌アプリ</h1>
    <p>STEP1・端末内保存の動作確認用</p>
  </header>

  <main>
    <div id="globalStatus" class="status" role="status" aria-live="polite">準備しています。</div>

    <section id="homeScreen" class="screen active">
      <h2>ホーム</h2>
      <button class="menu-button" id="goWrite">メモを書く</button>
      <button class="menu-button" id="goList">メモの一覧</button>
      <button class="menu-button" id="goBackup">バックアップ</button>
      <p class="help">この試作品のメモは、この端末のブラウザ内に保存されます。</p>
    </section>

    <section id="writeScreen" class="screen">
      <h2>メモを書く</h2>
      <label for="memoInput">メモの内容</label>
      <textarea id="memoInput" placeholder="ここにメモを入力してください。"></textarea>
      <div class="button-row">
        <button class="action-button" id="saveMemo">保存</button>
        <button class="back-button" data-back>ホームに戻る</button>
      </div>
    </section>

    <section id="listScreen" class="screen">
      <h2>メモの一覧</h2>
      <div id="memoList"></div>
      <button class="back-button" data-back>ホームに戻る</button>
    </section>

    <section id="backupScreen" class="screen">
      <h2>バックアップ</h2>
      <p class="help">書き出し：保存済みのメモをJSONファイルにします。</p>
      <button class="action-button" id="exportBackup">書き出し</button>

      <div class="help">
        <strong>読み込み：</strong><br>
        JSONバックアップを選んで読み込みます。同じIDのメモは重複追加せず、新しいメモだけを追加します。現在のメモは削除・上書きしません。
      </div>
      <label class="file-label" for="backupFile">読み込むJSONファイルを選択
        <input id="backupFile" type="file" accept=".json,application/json">
      </label>
      <button class="action-button" id="importBackup">読み込み</button>
      <button class="back-button" data-back>ホームに戻る</button>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
